version: "3.8"

services:
  backend:
    build:
      context: .
    container_name: fastapi-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - frontend

  frontend:
    build:
      context: ./vue-frontend
    container_name: vue-frontend
    ports:
      - "8080:8080"
    volumes:
      - ./vue-frontend:/app
    env_file:
      - .env
    working_dir: /app
    command: npm run serve

volumes:
  appdata:
