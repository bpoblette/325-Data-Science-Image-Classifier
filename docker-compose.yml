services:
  backend:
    build:
      context: .
    container_name: fastapi-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - frontend

  frontend:
    build: ./vue-frontend
    container_name: vue-frontend
    ports:
      - "8080:8080"
    volumes:
      - ./vue-frontend:/app
